<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Calculator.css">
    <script src="https://kit.fontawesome.com/8f5974d429.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class = "main-box">
        <h1>Calculator</h1>
        <input type="text"class="typebox" placeholder="0" readonly ><!---/*readonly is an HTML attribute that prevents the user from editing an input field, but JavaScript can still change its value.*/ -->
        <div class="row1">
            <button class="btn">÷</button>
            <button class="btn">x</button>
            <button class="btn">+</button>
            <button class="btn">-</button>
        </div>
        <div class="row2">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn" id="backspace"><i class="fa-solid fa-delete-left"></i></button>
        </div>
        <div class="row3">
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn" id="cancel">C</button>
        </div>
        <div class="row4">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn" id="equal">=</button>
        </div>
        <div class="row5">
            <button class="btn">.</button>
            <button class="btn" id="zero">0</button>
        </div>
    </div>
<script src="Calculator.js">
</script>
</body>
</html>
